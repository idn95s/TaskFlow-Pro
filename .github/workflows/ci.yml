name: CI Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk
          architecture: x64

      - name: Set up environment variables
        run: |
          echo "PSQL_URL=${{ secrets.PSQL_URL }}" >> $GITHUB_ENV
          echo "PSQL_USERNAME=${{ secrets.PSQL_USERNAME }}" >> $GITHUB_ENV
          echo "PSQL_PASSWORD=${{ secrets.PSQL_PASSWORD }}" >> $GITHUB_ENV

      - name: Update db url
        run: sed -i 's|<db_url>|${{ secrets.PSQL_URL }}|' ./server/src/main/resources/application.properties

      - name: Update db username
        run: sed -i 's|<db_username>|${{ secrets.PSQL_USERNAME }}|' ./server/src/main/resources/application.properties

      - name: Update db password
        run: sed -i 's|<db_password>|${{ secrets.PSQL_PASSWORD }}|' ./server/src/main/resources/application.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./server/gradlew

      - name: Build project
        working-directory: ./server
        run: ./gradlew clean build -x test

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: jdk
          architecture: x64

      - name: Set up environment variables
        run: |
          echo "PSQL_URL=${{ secrets.PSQL_URL }}" >> $GITHUB_ENV
          echo "PSQL_USERNAME=${{ secrets.PSQL_USERNAME }}" >> $GITHUB_ENV
          echo "PSQL_PASSWORD=${{ secrets.PSQL_PASSWORD }}" >> $GITHUB_ENV

      - name: Update db url
        run: sed -i 's|<db_url>|${{ secrets.PSQL_URL }}|' ./server/src/main/resources/application.properties

      - name: Update db username
        run: sed -i 's|<db_username>|${{ secrets.PSQL_USERNAME }}|' ./server/src/main/resources/application.properties

      - name: Update db password
        run: sed -i 's|<db_password>|${{ secrets.PSQL_PASSWORD }}|' ./server/src/main/resources/application.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./server/gradlew

      - name: Run tests
        working-directory: ./server
        run: ./gradlew test
